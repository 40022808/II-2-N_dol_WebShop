<div class="container">
    <div>
      <div class="top">
        <button class="add-btn" (click)="openDialog()">{{ 'add' | translate }}</button>
      </div>
      <div class="bottom">
        <div class="header">
          <h1>ID</h1>
          <h1>{{ 'Name' | translate }}</h1>
          <h1>{{ 'Price' | translate }}</h1>
          <h1>{{ 'Description' | translate }}</h1>
          <h1>{{ 'Category' | translate }}</h1>
          <h1>{{ 'Operations' | translate }}</h1>
        </div>
        <div class="content">
          <div *ngFor="let product of products" class="product-row">
            <span>{{ product.id }}</span>
            <span>{{ product.name }}</span>
            <span>{{ product.price }}</span>
            <span>{{ product.description }}</span>
            <span>{{ product.category }}</span>
            <button class="edit-btn" (click)="editProduct(product)">{{ 'edit' | translate }}</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  
    <app-product-dialog *ngIf="showDialog"
                    [product]="currentProduct"
                    (save)="onSave($event)"
                    (cancel)="onCancel()"
                    (delete)="onDelete()"
                    class="product-dialog">
    </app-product-dialog>
