<div class="container">
    <div>
        <div class="top">
            <button class="add-btn" (click)="openDialog()">{{'add' | translate }}</button>
        </div>
        <div class="bottom">
            <div class="header">
                <h1>{{'Name' | translate }}</h1>
                <h1>{{'Price' | translate }}</h1>
                <h1>{{'Description' | translate }}</h1>
                <h1>{{'Category' | translate }}</h1>
                <h1>{{'Operations' | translate }}</h1>
            </div>
            <div class="content">

            </div>
        </div>
    </div>
</div>

<app-product-dialog *ngIf="showDialog" (save)="onSave($event)" (cancel)="onCancel()" class="product-dialog"></app-product-dialog>
